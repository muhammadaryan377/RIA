name: ARIA App Smoke Test

on:
  push:
    branches: [chatgpt-app-smoke]
  workflow_dispatch:

jobs:
  app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_insight_advanced.txt

      - name: Run exactly python app.py
        shell: bash
        run: |
          set -euo pipefail
          export ARIA_PORT=8000
          python app.py > app-smoke.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          echo '--- app.py log ---'
          cat app-smoke.log

          if [ "$ready" -ne 1 ]; then
            echo 'python app.py did not become ready on port 8000.'
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/ > index.html
          curl -fsS http://127.0.0.1:8000/api/providers > providers.json

          python - <<'PY'
          import json
          health = json.load(open('health.json', encoding='utf-8'))
          providers = json.load(open('providers.json', encoding='utf-8'))
          print('APP_READY=True')
          print('Health critical:', health.get('critical'))
          print('Ollama:', health.get('ollama'))
          print('Default DB:', health.get('default_db'))
          print('Providers:', sorted((providers.get('providers') or {}).keys()))
          PY

      - name: Inspect registered routes after app startup
        run: |
          python - <<'PY'
          from app import app
          from api import query_routes
          routes = sorted({getattr(r, 'path', '') for r in app.routes})
          print('Registered routes:')
          for route in routes:
              print(' -', route)
          print('InsightAgent module:', query_routes.InsightAgent.__module__)
          print('InsightAgent class:', query_routes.InsightAgent.__name__)
          PY
