name: ARIA App Smoke Test

on:
  push:
    branches: [chatgpt-app-smoke]
  workflow_dispatch:

jobs:
  app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_insight_advanced.txt
          pip install pytest

      - name: Compile project
        run: |
          python -m compileall -q .

      - name: Inspect application wiring
        run: |
          python - <<'PY'
          import api
          from app import app
          from api import auth_routes, connect_routes, query_routes, schema_routes

          print('api package:', api.__file__)
          for mod in (auth_routes, connect_routes, schema_routes, query_routes):
              print(mod.__name__, 'file=', mod.__file__)
              print(' router paths=', [getattr(r, 'path', '') for r in mod.router.routes])

          routes = sorted({getattr(r, 'path', '') for r in app.routes})
          required = {'/', '/api/health', '/api/providers', '/api/ask', '/api/insight'}
          missing = sorted(required - set(routes))
          print('Registered app routes:')
          for route in routes:
              print(' -', route)
          print('InsightAgent module:', query_routes.InsightAgent.__module__)
          print('InsightAgent class:', query_routes.InsightAgent.__name__)
          print('Missing required routes:', missing)
          PY

      - name: Run python app.py and probe HTTP endpoints
        shell: bash
        run: |
          set -euo pipefail
          export ARIA_PORT=8000
          python app.py > app-smoke.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo 'App did not become ready.'
            cat app-smoke.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/api/providers > providers.json
          curl -fsS http://127.0.0.1:8000/ > index.html

          python - <<'PY'
          import json
          health = json.load(open('health.json', encoding='utf-8'))
          providers = json.load(open('providers.json', encoding='utf-8'))
          print('Health critical:', health.get('critical'))
          print('Ollama:', health.get('ollama'))
          print('Default DB:', health.get('default_db'))
          print('Providers:', sorted((providers.get('providers') or {}).keys()))
          if health.get('critical'):
              raise SystemExit('Critical dependency check failed: ' + ', '.join(health['critical']))
          PY

          echo '--- app.py log ---'
          cat app-smoke.log

      - name: Run Insight Agent integration tests
        run: |
          python -m pytest -q \
            tests/test_encoded_prediction.py \
            tests/test_advanced_insight_agent.py \
            tests/test_decision_intelligence.py \
            tests/test_industry_insight_agent.py
