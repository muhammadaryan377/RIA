name: Insight Agent CI

on:
  push:
    branches: [main]
    paths:
      - "api/query_routes.py"
      - "app.py"
      - "insight_agent_advanced.py"
      - "insight_agent_industry.py"
      - "insight_extensions/**"
      - "prediction/tabular.py"
      - "tests/test_app_wiring.py"
      - "tests/test_advanced_insight_agent.py"
      - "tests/test_encoded_prediction.py"
      - "tests/test_decision_intelligence.py"
      - "tests/test_industry_insight_agent.py"
      - "requirements.txt"
      - "requirements_insight_advanced.txt"
      - ".github/workflows/insight-agent-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/query_routes.py"
      - "app.py"
      - "insight_agent_advanced.py"
      - "insight_agent_industry.py"
      - "insight_extensions/**"
      - "prediction/tabular.py"
      - "tests/test_app_wiring.py"
      - "tests/test_advanced_insight_agent.py"
      - "tests/test_encoded_prediction.py"
      - "tests/test_decision_intelligence.py"
      - "tests/test_industry_insight_agent.py"
      - "requirements.txt"
      - "requirements_insight_advanced.txt"

jobs:
  insight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application and insight modules
        run: |
          python -m py_compile app.py
          python -m py_compile api/query_routes.py
          python -m py_compile insight_agent_advanced.py
          python -m py_compile insight_agent_industry.py
          python -m py_compile insight_extensions/decision_intelligence.py
          python -m py_compile prediction/tabular.py

      - name: Verify application wiring
        run: |
          python -m pytest -q tests/test_app_wiring.py

      - name: Run python app.py smoke test
        shell: bash
        run: |
          set -euo pipefail
          export ARIA_PORT=8000
          python app.py > app-smoke.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat app-smoke.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/api/providers > providers.json
          curl -fsS http://127.0.0.1:8000/openapi.json > openapi.json

          python - <<'PY'
          import json
          schema = json.load(open('openapi.json', encoding='utf-8'))
          paths = set(schema.get('paths', {}))
          expected = {
              '/api/auth/login',
              '/api/connect',
              '/api/schema',
              '/api/ask',
              '/api/insight',
              '/api/health',
              '/api/providers',
          }
          missing = expected - paths
          if missing:
              raise SystemExit('Missing runtime routes: ' + ', '.join(sorted(missing)))

          from api import query_routes
          from insight_agent_industry import IndustryInsightAgent
          if query_routes.InsightAgent is not IndustryInsightAgent:
              raise SystemExit('API is not wired to IndustryInsightAgent')

          print('python app.py runtime wiring OK')
          print('Insight Agent:', query_routes.InsightAgent.__name__)
          print('Industry version:', query_routes.InsightAgent.VERSION)
          PY

          cat app-smoke.log

      - name: Run insight tests
        run: |
          python -m pytest -q \
            tests/test_encoded_prediction.py \
            tests/test_advanced_insight_agent.py \
            tests/test_decision_intelligence.py \
            tests/test_industry_insight_agent.py
