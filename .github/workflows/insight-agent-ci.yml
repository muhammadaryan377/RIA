name: Insight Agent CI

on:
  push:
    branches: [main]
    paths:
      - "insight_agent_advanced.py"
      - "insight_agent_industry.py"
      - "insight_extensions/**"
      - "prediction/tabular.py"
      - "tests/test_advanced_insight_agent.py"
      - "tests/test_encoded_prediction.py"
      - "tests/test_decision_intelligence.py"
      - "tests/test_industry_insight_agent.py"
      - "requirements_insight_advanced.txt"
      - ".github/workflows/insight-agent-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "insight_agent_advanced.py"
      - "insight_agent_industry.py"
      - "insight_extensions/**"
      - "prediction/tabular.py"
      - "tests/test_advanced_insight_agent.py"
      - "tests/test_encoded_prediction.py"
      - "tests/test_decision_intelligence.py"
      - "tests/test_industry_insight_agent.py"
      - "requirements_insight_advanced.txt"

jobs:
  insight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_insight_advanced.txt
          pip install pytest

      - name: Compile advanced insight modules
        run: |
          python -m py_compile insight_agent_advanced.py
          python -m py_compile insight_agent_industry.py
          python -m py_compile insight_extensions/decision_intelligence.py
          python -m py_compile prediction/tabular.py

      - name: Run additive insight tests
        run: |
          python -m pytest -q \
            tests/test_encoded_prediction.py \
            tests/test_advanced_insight_agent.py \
            tests/test_decision_intelligence.py \
            tests/test_industry_insight_agent.py
